repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/Scripts/python.exe -m ruff check src tests scripts
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest
        language: system
        pass_filenames: false