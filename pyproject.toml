[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchcaddy"
version = "0.1.0"
description = "Lightweight benchmark sweeps with environment capture."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.41",
    "typer>=0.12.5",
    "rich>=13.9.4",
    "gitpython>=3.1.43",
    "psutil>=6.1.1",
]

[project.scripts]
benchcaddy = "benchcaddy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
